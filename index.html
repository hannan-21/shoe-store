<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stride – Everyday Shoes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <a href="#" class="logo">Stride</a>
    <button class="cart-btn" id="cartBtn">Cart (<span id="cartCount">0</span>)</button>
  </header>

  <section class="hero">
    <h1>Shoes that<br>keep up with you.</h1>
    <p>Simple, comfy and built for daily walks, runs and everything in between.</p>
    <a href="#shop" class="btn">Shop shoes</a>
  </section>

  <main id="shop">
    <div class="filters" id="filters">
      <button class="filter active" data-type="all">All</button>
      <button class="filter" data-type="running">Running</button>
      <button class="filter" data-type="casual">Casual</button>
      <button class="filter" data-type="boots">Boots</button>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <!-- Cart panel -->
  <aside class="cart" id="cart" aria-hidden="true">
    <div class="cart-head">
      <h2>Your cart</h2>
      <button id="closeCart" aria-label="Close cart">&times;</button>
    </div>
    <ul id="cartItems"></ul>
    <p class="total">Total: $<span id="cartTotal">0</span></p>
  </aside>

  <footer>
    <p>Made by <a href="https://github.com/hannan-21">hannan-21</a> &middot; Demo project, nothing is really for sale.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
